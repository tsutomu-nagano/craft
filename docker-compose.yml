services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://craft:craft@db:5432/craft
      MINER_API_BASE_URL: ${MINER_API_BASE_URL:-http://miner:8000}
      MACHINE_READABLE_CHECKER_API_BASE_URL: ${MACHINE_READABLE_CHECKER_API_BASE_URL:-http://machine-readable-checker:8000}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  tunnel-client:
    build:
      context: .
      dockerfile: Dockerfile.tunnel-client
    container_name: craft-mcp-tunnel-client
    network_mode: service:app
    env_file:
      - path: .env.tunnel
        required: false
    environment:
      MCP_SERVER_URL: http://127.0.0.1:8000/mcp
    volumes:
      - ${HOME}/.local/bin/tunnel-client:/usr/local/bin/tunnel-client:ro
      - ${HOME}/.config/tunnel-client:/home/tunnel-client/.config/tunnel-client
    command:
      - sh
      - -c
      - |
        tunnel-client init --force --profile craft --tunnel-id "$${CONTROL_PLANE_TUNNEL_ID}" --mcp-server-url http://127.0.0.1:8000/mcp
        tunnel-client run --profile craft
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: craft
      POSTGRES_USER: craft
      POSTGRES_PASSWORD: craft
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craft -d craft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
